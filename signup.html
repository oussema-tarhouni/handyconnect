<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Inscription — HandyConnect</title>
    <meta name="theme-color" content="#3D5AF1">
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="icon" href="img/logo.svg">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="hd"></div>
    <main class="w">
        <div class="au">
            <div class="al">
                <h2>Rejoignez HandyConnect</h2>
                <p>Clients : gratuit. Artisans : profil visible avec abonnement actif.</p>
                <ul>
                    <li>✓ Gratuit pour les clients</li>
                    <li>✓ Avis liés aux interventions</li>
                    <li>✓ Contact par téléphone</li>
                </ul>
            </div>
            <div class="ar">
                <form action="api/signup" method="post" data-form="signup">
                    <h1 data-ar="إنشاء حساب">Créer un compte</h1>
                    <div class="tabs"><label><input type="radio" name="role" value="client"
                                checked><span>Client</span></label><label><input type="radio" name="role"
                                value="artisan" id="ra"><span>Artisan</span></label></div><label for="su-n">Nom
                        complet</label><input id="su-n" name="fullname" required minlength="2" maxlength="60"
                        autocomplete="name"><label for="su-t">Téléphone</label><input id="su-t" name="phone" type="tel"
                        required placeholder="+216 …" autocomplete="tel"
                        pattern="(\+216[ ]?)?[2-579]\d[ ]?\d{3}[ ]?\d{3}"
                        title="Numéro tunisien à 8 chiffres (ex. +216 20 123 456)"><label for="su-e">Email
                        (facultatif)</label><input id="su-e" name="email" type="email" maxlength="80"
                        autocomplete="email"><label for="su-g">Gouvernorat</label><select id="su-g" name="gov"
                        class="jv" data-pick required></select>
                    <fieldset id="m" hidden disabled><label for="su-m">Votre métier</label><select id="su-m"
                            name="trade" class="jm" data-pick required></select><label
                            for="su-s">Spécialités</label><textarea id="su-s" name="skills" rows="2" required
                            minlength="3" maxlength="200"></textarea><label for="su-z">Zone d’intervention</label><input
                            id="su-z" name="zone" required minlength="2" maxlength="80"></fieldset><label for="su-p">Mot
                        de passe</label>
                    <div class="pw"><input id="su-p" name="password" type="password" minlength="6" maxlength="64"
                            required autocomplete="new-password"><button type="button" class="pe" data-ic="eye"
                            aria-label="Afficher"></button></div><label for="su-c">Confirmer le mot de passe</label>
                    <div class="pw"><input id="su-c" name="confirm" type="password" minlength="6" maxlength="64"
                            required autocomplete="new-password"><button type="button" class="pe" data-ic="eye"
                            aria-label="Afficher"></button></div><label
                        style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="terms" required
                            style="width:auto"> J’accepte les conditions</label><button class="bf">S’inscrire</button>
                    <p class="alt">Déjà inscrit ? <a href="signin.html">Connexion</a></p>
                </form>
            </div>
        </div>
    </main>
    <div id="ft"></div>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/forms.js"></script>
</body>

</html>
