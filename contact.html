<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Contact — HandyConnect</title>
    <meta name="theme-color" content="#3D5AF1">
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="icon" href="img/logo.svg">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="hd"></div>
    <main class="w">
        <div class="hc">
            <div>
                <h1 data-ar="تواصل <span>معنا</span>">Contactez-<span>nous</span></h1>
            </div>
            <div class="hv">
                <div class="cr"><span data-ic="phone"></span></div>
                <div class="fc"><b>Équipe support</b><br><span class="sr">★★★★★</span><br><small>Réponse sous 24
                        h</small></div>
            </div>
        </div>
        <div class="cg">
            <form class="fm" action="api/contact" method="post" data-form="contact">
                <h3>Formulaire de contact</h3><label for="ct-n">Nom <em>*</em></label><input id="ct-n" name="name"
                    required minlength="2" maxlength="60" autocomplete="name"><label for="ct-e">Email
                    <em>*</em></label><input id="ct-e" name="email" type="email" required maxlength="80"
                    autocomplete="email"><label for="ct-s">Sujet <em>*</em></label><input id="ct-s" name="subject"
                    required minlength="3" maxlength="100"><label for="ct-m">Message <em>*</em></label><textarea
                    id="ct-m" name="message" required minlength="10" maxlength="1000"></textarea><button
                    class="bf">Envoyer</button>
            </form>
            <div class="dk">
                <h2 data-ar="اتصل بنا">Nos coordonnées</h2>
                <div><span data-ic="phone"></span><span><small>Téléphone</small><b>+216 71 000 000</b></span></div>
                <div><span data-ic="phone"></span><span><small>Mobile</small><b>+216 20 000 000</b></span></div>
                <div><span data-ic="mail"></span><span><small>Email</small><b>contact@handyconnect.tn</b></span></div>
            </div>
        </div>
        <h2 class="st" style="margin-top:40px">Nos <span>bureaux</span></h2>
    </main>
    <section class="bg" style="padding:48px 0">
        <div class="w">
            <div class="ofc">
                <div class="mp" id="mp"></div>
                <div class="ol" id="of"></div>
            </div>
        </div>
    </section>
    <section class="nl" data-nl></section>
    <div id="ft"></div>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/forms.js"></script>
</body>

</html>
